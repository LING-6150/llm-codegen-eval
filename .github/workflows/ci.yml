name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline pytest only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --extra api --dev

      - name: Run offline tests only
        # Live Java service / LLM benchmarks are intentionally manual and are
        # not run in CI because they require external services and providers.
        run: |
          uv run playwright install --with-deps --only-shell chromium
          uv run pytest

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/azure, infra/workloads]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=${{ matrix.root }} init -backend=false -lockfile=readonly
      - run: terraform -chdir=${{ matrix.root }} validate

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: llm-codegen-eval:smoke
          build-args: EVAL_GIT_COMMIT=${{ github.sha }}
      - name: Run the packaged benchmark and query its reports
        run: |
          docker run --rm --network none \
            -v "$PWD/tests/smoke_serving_image.py:/tmp/smoke_serving_image.py:ro" \
            llm-codegen-eval:smoke python /tmp/smoke_serving_image.py --expected-revision "$GITHUB_SHA"
