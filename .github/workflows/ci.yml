name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline pytest only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --extra api --dev

      - name: Run offline tests only
        # Live Java service / LLM benchmarks are intentionally manual and are
        # not run in CI because they require external services and providers.
        run: |
          uv run playwright install --with-deps --only-shell chromium
          uv run pytest

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/azure, infra/workloads]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=${{ matrix.root }} init -backend=false -lockfile=readonly
      - run: terraform -chdir=${{ matrix.root }} validate

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: llm-codegen-eval:smoke
          build-args: EVAL_GIT_COMMIT=${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the locked test runner
        run: |
          uv export --frozen --only-group dev --no-emit-project -o "$RUNNER_TEMP/eval-test-requirements.txt"
          uv pip install --python 3.13 --target "$RUNNER_TEMP/eval-test-deps" -r "$RUNNER_TEMP/eval-test-requirements.txt"
      - name: Run existing benchmark and API regression tests against the packaged application
        run: |
          docker run --rm --network none \
            -v "$RUNNER_TEMP/eval-test-deps:/opt/test-deps:ro" -e PYTHONPATH=/opt/test-deps \
            -v "$PWD/tests:/tests:ro" llm-codegen-eval:smoke python -m pytest -q -p no:cacheprovider \
            /tests/test_serving.py::test_cli_publishes_complete_reports_and_graphql_can_read_them \
            /tests/test_graphql.py::test_serving_and_legacy_queries
