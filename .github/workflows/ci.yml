name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline pytest only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --extra api --dev

      - name: Run offline tests only
        # Live Java service / LLM benchmarks are intentionally manual and are
        # not run in CI because they require external services and providers.
        run: uv run pytest

  eval-regression-gate:
    name: Offline eval regression gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --dev
      - name: Compare against the PR base baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python scripts/eval_regression_gate.py check --base-ref "$BASE_SHA" --report reports/eval-regression-gate.md
      - name: Upload eval regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-regression-report
          path: reports/eval-regression-gate.md
          if-no-files-found: error

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/azure, infra/workloads]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=${{ matrix.root }} init -backend=false -lockfile=readonly
      - run: terraform -chdir=${{ matrix.root }} validate

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
